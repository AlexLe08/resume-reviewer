name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: these checks never need to write to the repo.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, so branch protection has one check name to require: "checks".
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes src/lib/demo/recordings.test.ts: it fails when a prompt, persona,
      # fact, schema or sample changed without re-recording demo/recordings.
      - run: npm test
      - run: npm run build
